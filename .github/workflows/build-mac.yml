name: Build macOS DMG

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build DMG (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x64
            runner: macos-15-intel
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build DMG
        run: npm run desktop:mac -- --${{ matrix.arch }} --publish never

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: ASR-Workbench-mac-${{ matrix.arch }}
          path: release/*.dmg
          if-no-files-found: error
