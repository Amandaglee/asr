name: Build macOS DMG

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build DMG
        run: npm run desktop:mac -- --arm64 --publish never

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: ASR-Workbench-mac-arm64
          path: release/*.dmg
          if-no-files-found: error
